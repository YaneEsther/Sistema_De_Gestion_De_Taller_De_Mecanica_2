<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TallerGest - Clientes y Vehículos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wrench-adjustable-circle"></i></div>
      <div><h1 class="brand-title">TallerGest</h1><span class="brand-subtitle">Gestión de Taller</span></div>
    </div>
    <ul class="sidebar-menu">
      <li><a href="/dashboard.html"><i class="bi bi-house-door"></i> Inicio</a></li>
      <li><a href="/clientes.html" class="active"><i class="bi bi-people"></i> Clientes & Vehículos</a></li>
      <li><a href="/recepcion.html"><i class="bi bi-box-arrow-in-right"></i> Recepción & Diagnóstico</a></li>
      <li><a href="/ordenes.html"><i class="bi bi-clipboard-check"></i> Órdenes de trabajo</a></li>
      <li><a href="/inventario.html"><i class="bi bi-boxes"></i> Inventario & Servicios</a></li>
      <li><a href="/facturacion.html"><i class="bi bi-file-earmark-text"></i> Facturación & Pagos</a></li>
    </ul>
  </aside>

  <div class="main-wrapper">
    <header class="top-navbar">
      <h2 class="page-title">Gestión de Clientes y Vehículos</h2>
      <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalCliente">+ Nuevo Cliente</button>
    </header>

    <main class="content-body">
      <div class="card card-custom">
        <div class="card-body p-0">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaClientes"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL NUEVO CLIENTE -->
  <div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registrar Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formCliente">
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Nombre Completo</label><input type="text" id="cliNombre" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Teléfono</label><input type="text" id="cliTelefono" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Correo Electrónico</label><input type="email" id="cliCorreo" class="form-control" required></div>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-gold">Guardar Cliente</button></div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL AGREGAR VEHÍCULO -->
  <div class="modal fade" id="modalVehiculo" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Vehículo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formVehiculo">
          <input type="hidden" id="vehClienteId">
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Placa</label><input type="text" id="vehPlaca" class="form-control" required></div>
            <div class="row">
              <div class="col-6 mb-3"><label class="form-label">Marca</label><input type="text" id="vehMarca" class="form-control" required></div>
              <div class="col-6 mb-3"><label class="form-label">Modelo</label><input type="text" id="vehModelo" class="form-control" required></div>
            </div>
            <div class="mb-3"><label class="form-label">Año</label><input type="number" id="vehAnio" class="form-control" required></div>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-azul">Registrar Vehículo</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function cargarClientes() {
      const res = await fetch('/api/clientes');
      const clientes = await res.json();
      const tbody = document.getElementById('tablaClientes');
      tbody.innerHTML = '';
      clientes.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>#${c.id}</td>
            <td class="fw-bold">${c.nombre}</td>
            <td>${c.telefono}</td>
            <td>${c.correo}</td>
            <td>
              <button class="btn btn-sm btn-gold py-1 px-2" onclick="abrirModalVehiculo(${c.id})">+ Vehículo</button>
              <button class="btn btn-sm btn-outline-primary py-1 px-2" onclick="verVehiculos(${c.id})">Ver Vehículos</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('formCliente').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = { nombre: document.getElementById('cliNombre').value, telefono: document.getElementById('cliTelefono').value, correo: document.getElementById('cliCorreo').value };
      const res = await fetch('/api/clientes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('modalCliente')).hide(); cargarClientes(); }
    });

    function abrirModalVehiculo(id) { document.getElementById('vehClienteId').value = id; new bootstrap.Modal(document.getElementById('modalVehiculo')).show(); }

    document.getElementById('formVehiculo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = { cliente_id: document.getElementById('vehClienteId').value, placa: document.getElementById('vehPlaca').value, marca: document.getElementById('vehMarca').value, modelo: document.getElementById('vehModelo').value, anio: document.getElementById('vehAnio').value };
      const res = await fetch('/api/clientes/vehiculos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('modalVehiculo')).hide(); alert('Vehículo registrado'); }
    });

    async function verVehiculos(id) {
      const res = await fetch(`/api/clientes/${id}/vehiculos`);
      const vehs = await res.json();
      if (vehs.length === 0) return alert('Sin vehículos registrados');
      alert('Vehículos:\n' + vehs.map(v => `${v.marca} ${v.modelo} (${v.anio}) - Placa: ${v.placa}`).join('\n'));
    }

    cargarClientes();
  </script>
</body>
</html>
