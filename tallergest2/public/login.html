<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TallerGest v2 - Inicio de Sesión</title>
 <link href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { background-color: #1F2937; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card-login { width: 100%; max-width: 420px; padding: 35px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); background-color: #FFFFFF; }
  </style>
</head>
<body>

  <div class="card card-login">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-2" style="width: 60px; height: 60px; background-color: #1E3A6D !important; border: 3px solid #D18B00;">
        <i class="bi bi-wrench-adjustable-circle fs-2"></i>
      </div>
      <h3 class="fw-bold text-dark mb-0">TallerGest v2</h3>
      <p class="text-muted small">Sistema de Gestión de Taller Mecánico</p>
    </div>

    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="usuario" class="form-label fw-semibold">Usuario</label>
        <input type="text" class="form-control" id="usuario" placeholder="Ej: admin" required>
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label fw-semibold">Contraseña</label>
        <input type="password" class="form-control" id="clave" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-gold w-100 py-2 mt-2">Ingresar al Sistema</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.add('d-none');

      const nombre_usuario = document.getElementById('usuario').value;
      const clave = document.getElementById('clave').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre_usuario, clave })
        });

        const data = await response.json();

        if (!response.ok) {
          alertBox.textContent = data.error || 'Credenciales inválidas';
          alertBox.classList.remove('d-none');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('usuario', JSON.stringify(data.usuario));
        window.location.href = '/dashboard.html';
      } catch (err) {
        alertBox.textContent = 'No se pudo conectar con el servidor';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
