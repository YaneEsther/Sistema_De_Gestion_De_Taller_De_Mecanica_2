<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TallerGest - Recepción & Diagnóstico</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wrench-adjustable-circle"></i></div>
      <div><h1 class="brand-title">TallerGest</h1><span class="brand-subtitle">Gestión de Taller</span></div>
    </div>
    <ul class="sidebar-menu">
      <li><a href="/dashboard.html"><i class="bi bi-house-door"></i> Inicio</a></li>
      <li><a href="/clientes.html"><i class="bi bi-people"></i> Clientes & Vehículos</a></li>
      <li><a href="/recepcion.html" class="active"><i class="bi bi-box-arrow-in-right"></i> Recepción & Diagnóstico</a></li>
      <li><a href="/ordenes.html"><i class="bi bi-clipboard-check"></i> Órdenes de trabajo</a></li>
      <li><a href="/inventario.html"><i class="bi bi-boxes"></i> Inventario & Servicios</a></li>
      <li><a href="/facturacion.html"><i class="bi bi-file-earmark-text"></i> Facturación & Pagos</a></li>
    </ul>
  </aside>

  <div class="main-wrapper">
    <header class="top-navbar">
      <h2 class="page-title">Recepción y Diagnóstico de Vehículos</h2>
      <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalRecepcion" onclick="cargarVehiculosSelect()">+ Recibir Vehículo</button>
    </header>

    <main class="content-body">
      <div class="card card-custom">
        <div class="card-body p-0">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th>ID Rec.</th>
                <th>Fecha</th>
                <th>Vehículo</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaRecepciones"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL RECEPCIÓN -->
  <div class="modal fade" id="modalRecepcion" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Entrada de Vehículo</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="formRecepcion">
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Vehículo</label><select id="recVehiculoId" class="form-select" required></select></div>
            <div class="mb-3"><label class="form-label">Observaciones</label><textarea id="recObservaciones" class="form-control" rows="3" required></textarea></div>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-gold">Registrar Recepción</button></div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL DIAGNÓSTICO -->
  <div class="modal fade" id="modalDiagnostico" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Diagnóstico Técnico</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="formDiagnostico">
          <input type="hidden" id="diagRecepcionId">
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Hallazgos Técnicos</label><textarea id="diagHallazgos" class="form-control" rows="4" required></textarea></div>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-azul">Guardar Diagnóstico</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function cargarRecepciones() {
      const res = await fetch('/api/recepcion');
      const recs = await res.json();
      const tbody = document.getElementById('tablaRecepciones');
      tbody.innerHTML = '';
      recs.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>#${r.recepcion_id}</td>
            <td>${new Date(r.fecha_recepcion).toLocaleString()}</td>
            <td><strong>${r.marca} ${r.modelo}</strong> (${r.placa})</td>
            <td>${r.cliente_nombre}</td>
            <td><span class="badge bg-warning text-dark">${r.orden_estado}</span></td>
            <td>
              ${!r.diagnostico_id ? 
                `<button class="btn btn-sm btn-gold" onclick="abrirModalDiag(\${r.recepcion_id})">+ Diagnóstico</button>` : 
                `<button class="btn btn-sm btn-outline-secondary" onclick="verDiag(\${r.recepcion_id})">Ver Diagnóstico</button>`}
            </td>
          </tr>
        `;
      });
    }

    async function cargarVehiculosSelect() {
      const res = await fetch('/api/clientes');
      const clientes = await res.json();
      const select = document.getElementById('recVehiculoId');
      select.innerHTML = '';
      for (const c of clientes) {
        const resV = await fetch(`/api/clientes/${[se quitó el vínculo sospechoso]}/vehiculos`);
        const vehs = await resV.json();
        vehs.forEach(v => { select.innerHTML += `<option value="${[se quitó el vínculo sospechoso]}">${v.placa} - ${v.marca} ${v.modelo} (${c.nombre})</option>`; });
      }
    }

    document.getElementById('formRecepcion').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = { vehiculo_id: document.getElementById('recVehiculoId').value, observaciones: document.getElementById('recObservaciones').value };
      const res = await fetch('/api/recepcion', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('modalRecepcion')).hide(); cargarRecepciones(); }
    });

    function abrirModalDiag(id) { document.getElementById('diagRecepcionId').value = id; new bootstrap.Modal(document.getElementById('modalDiagnostico')).show(); }

    document.getElementById('formDiagnostico').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = { recepcion_id: document.getElementById('diagRecepcionId').value, hallazgos: document.getElementById('diagHallazgos').value };
      const res = await fetch('/api/recepcion/diagnostico', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('modalDiagnostico')).hide(); cargarRecepciones(); }
    });

    async function verDiag(id) {
      const res = await fetch(`/api/recepcion/${id}/diagnostico`);
      const d = await res.json();
      alert('Hallazgos:\n\n' + d.hallazgos);
    }

    cargarRecepciones();
  </script>
</body>
</html>
