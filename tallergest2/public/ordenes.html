<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TallerGest - Órdenes de Trabajo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-icon"><i class="bi bi-wrench-adjustable-circle"></i></div>
      <div><h1 class="brand-title">TallerGest</h1><span class="brand-subtitle">Gestión de Taller</span></div>
    </div>
    <ul class="sidebar-menu">
      <li><a href="/dashboard.html"><i class="bi bi-house-door"></i> Inicio</a></li>
      <li><a href="/clientes.html"><i class="bi bi-people"></i> Clientes & Vehículos</a></li>
      <li><a href="/recepcion.html"><i class="bi bi-box-arrow-in-right"></i> Recepción & Diagnóstico</a></li>
      <li><a href="/ordenes.html" class="active"><i class="bi bi-clipboard-check"></i> Órdenes de trabajo</a></li>
      <li><a href="/inventario.html"><i class="bi bi-boxes"></i> Inventario & Servicios</a></li>
      <li><a href="/facturacion.html"><i class="bi bi-file-earmark-text"></i> Facturación & Pagos</a></li>
    </ul>
  </aside>

  <div class="main-wrapper">
    <header class="top-navbar">
      <h2 class="page-title">Órdenes de Trabajo</h2>
      <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#modalMecanico" onclick="cargarMecanicos()">Gestión de Mecánicos</button>
    </header>

    <main class="content-body">
      <div class="card card-custom">
        <div class="card-body p-0">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th>ID Órden</th>
                <th>Vehículo</th>
                <th>Cliente</th>
                <th>Mecánico</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaOrdenes"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- MODAL MECÁNICOS -->
  <div class="modal fade" id="modalMecanico" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Mecánicos</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="formMecanico" class="row g-2 mb-3">
            <div class="col-6"><input type="text" id="mecNombre" class="form-control" placeholder="Nombre" required></div>
            <div class="col-6"><input type="text" id="mecEspecialidad" class="form-control" placeholder="Especialidad" required></div>
            <div class="col-12"><button type="submit" class="btn btn-gold w-100 mt-2">+ Guardar Mecánico</button></div>
          </form>
          <ul class="list-group" id="listaMecanicos"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ASIGNAR -->
  <div class="modal fade" id="modalAsignar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Asignar Mecánico</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="formAsignar">
          <input type="hidden" id="asigOrdenId">
          <div class="modal-body">
            <label class="form-label">Mecánico</label>
            <select id="asigMecanicoId" class="form-select" required></select>
          </div>
          <div class="modal-footer"><button type="submit" class="btn btn-azul">Confirmar Asignación</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    async function cargarOrdenes() {
      const res = await fetch('/api/ordenes');
      const ords = await res.json();
      const tbody = document.getElementById('tablaOrdenes');
      tbody.innerHTML = '';
      ords.forEach(o => {
        tbody.innerHTML += `
          <tr>
            <td><strong>#OT-${o.orden_id}</strong></td>
            <td>${o.marca} ${o.modelo} (${o.placa})</td>
            <td>${o.cliente_nombre}</td>
            <td>${o.mecanico_nombre || '<span class="text-muted">Sin Asignar</span>'}</td>
            <td><span class="badge bg-primary">${o.estado}</span></td>
            <td>
              <button class="btn btn-sm btn-gold py-1 px-2" onclick="abrirModalAsignar(${o.orden_id})">Asignar Mecánico</button>
              <select class="form-select form-select-sm d-inline-block w-auto ms-1" onchange="cambiarEstado(${o.orden_id}, this.value)">
                <option value="">Cambiar Estado...</option>
                <option value="en_ejecucion">En Ejecución</option>
                <option value="finalizada">Finalizada</option>
              </select>
            </td>
          </tr>
        `;
      });
    }

    async function cargarMecanicos() {
      const res = await fetch('/api/ordenes/mecanicos');
      const mecs = await res.json();
      const lista = document.getElementById('listaMecanicos');
      lista.innerHTML = [se quitó el vínculo sospechoso](m => `<li class="list-group-item d-flex justify-content-between"><strong>${m.nombre}</strong><small>${m.especialidad}</small></li>`).join('');
    }

    document.getElementById('formMecanico').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = { nombre: document.getElementById('mecNombre').value, especialidad: document.getElementById('mecEspecialidad').value };
      await fetch('/api/ordenes/mecanicos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      cargarMecanicos();
    });

    async function abrirModalAsignar(id) {
      document.getElementById('asigOrdenId').value = id;
      const res = await fetch('/api/ordenes/mecanicos');
      const mecs = await res.json();
      const sel = document.getElementById('asigMecanicoId');
      sel.innerHTML = [se quitó el vínculo sospechoso](m => `<option value="${[se quitó el vínculo sospechoso]}">${m.nombre} - ${m.especialidad}</option>`).join('');
      new bootstrap.Modal(document.getElementById('modalAsignar')).show();
    }

    document.getElementById('formAsignar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('asigOrdenId').value;
      const mecanico_id = document.getElementById('asigMecanicoId').value;
      await fetch(`/api/ordenes/${id}/mecanico`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mecanico_id }) });
      bootstrap.Modal.getInstance(document.getElementById('modalAsignar')).hide();
      cargarOrdenes();
    });

    async function cambiarEstado(id, nuevoEstado) {
      if (!nuevoEstado) return;
      await fetch(`/api/ordenes/${id}/estado`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nuevoEstado }) });
      cargarOrdenes();
    }

    cargarOrdenes();
  </script>
</body>
</html>
