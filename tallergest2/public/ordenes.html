<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TallerGest v2 - Órdenes de Trabajo & Mecánicos</title>
  <link href="[suspicious link removed]" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">TallerGest v2</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/clientes.html">Clientes & Vehículos</a>
        <a class="nav-link" href="/recepcion.html">Recepción & Diagnóstico</a>
        <a class="nav-link active" href="/ordenes.html">Órdenes de Trabajo</a>
        <a class="nav-link text-danger" href="#" onclick="logout()">Cerrar Sesión</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Órdenes de Trabajo & Asignación de Mecánicos</h2>
      <div>
        <button class="btn btn-secondary me-2" data-bs-toggle="modal" data-bs-target="#modalMecanico" onclick="cargarMecanicos()">
          Mecanicos
        </button>
      </div>
    </div>

    <!-- Tabla de Órdenes de Trabajo -->
    <div class="card shadow-sm">
      <div class="card-body">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID Orden</th>
              <th>Vehículo</th>
              <th>Cliente</th>
              <th>Mecánico Asignado</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaOrdenes">
            <!-- Carga dinámica -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Registrar / Lista de Mecánicos -->
  <div class="modal fade" id="modalMecanico" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Gestión de Mecánicos</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formMecanico" class="row g-2 mb-4">
            <div class="col-md-5">
              <input type="text" id="mecNombre" class="form-control" placeholder="Nombre del mecánico" required>
            </div>
            <div class="col-md-5">
              <input type="text" id="mecEspecialidad" class="form-control" placeholder="Especialidad (Ej: Frenos, Motor)" required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">+ Guardar</button>
            </div>
          </form>
          <h6>Lista de Mecánicos</h6>
          <ul class="list-group" id="listaMecanicos">
            <!-- Carga de mecánicos -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Asignar Mecánico -->
  <div class="modal fade" id="modalAsignar" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Asignar Mecánico a la Orden</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="formAsignar">
          <input type="hidden" id="asigOrdenId">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Seleccionar Mecánico</label>
              <select id="asigMecanicoId" class="form-select" required>
                <!-- Opciones dinámicas -->
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-success">Confirmar Asignación</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="[suspicious link removed]"></script>
  <script>
    async function cargarOrdenes() {
      const res = await fetch('/api/ordenes');
      const ordenes = await res.json();
      const tbody = document.getElementById('tablaOrdenes');
      tbody.innerHTML = '';

      ordenes.forEach(o => {
        let badgeColor = 'bg-secondary';
        if (o.estado === 'recibida') badgeColor = 'bg-warning text-dark';
        if (o.estado === 'diagnosticada') badgeColor = 'bg-info text-dark';
        if (o.estado === 'en_ejecucion') badgeColor = 'bg-primary';
        if (o.estado === 'finalizada') badgeColor = 'bg-success';
        if (o.estado === 'facturada') badgeColor = 'bg-dark';

        tbody.innerHTML += `
          <tr>
            <td><strong>#OT-${o.orden_id}</strong></td>
            <td>${o.marca} ${o.modelo} (${o.placa})</td>
            <td>${o.cliente_nombre}</td>
            <td>${o.mecanico_nombre ? `<span class="fw-bold text-success">\${o.mecanico_nombre}</span>` : '<span class="text-muted">Sin Asignar</span>'}</td>
            <td><span class="badge ${badgeColor}">${o.estado}</span></td>
            <td>
              <button class="btn btn-sm btn-outline-primary" onclick="abrirModalAsignar(${o.orden_id})">Asignar Mecánico</button>
              <select class="form-select form-select-sm d-inline-block w-auto ms-1" onchange="cambiarEstado(${o.orden_id}, this.value)">
                <option value="">Cambiar estado...</option>
                <option value="en_ejecucion">En Ejecución</option>
                <option value="finalizada">Finalizada</option>
              </select>
            </td>
          </tr>
        `;
      });
    }

    async function cargarMecanicos() {
      const res = await fetch('/api/ordenes/mecanicos');
      const mecanicos = await res.json();
      const lista = document.getElementById('listaMecanicos');
      lista.innerHTML = '';

      mecanicos.forEach(m => {
        lista.innerHTML += `
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <div>
              <strong>${m.nombre}</strong> <small class="text-muted">(${m.especialidad})</small>
            </div>
            <span class="badge bg-success">Disponible</span>
          </li>
        `;
      });
    }

    document.getElementById('formMecanico').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nombre: document.getElementById('mecNombre').value,
        especialidad: document.getElementById('mecEspecialidad').value
      };

      const res = await fetch('/api/ordenes/mecanicos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        document.getElementById('formMecanico').reset();
        cargarMecanicos();
      } else {
        alert('Error al guardar mecánico');
      }
    });

    async function abrirModalAsignar(ordenId) {
      document.getElementById('asigOrdenId').value = ordenId;
      const res = await fetch('/api/ordenes/mecanicos');
      const mecanicos = await res.json();
      const select = document.getElementById('asigMecanicoId');
      select.innerHTML = '<option value="">Seleccione mecánico...</option>';
      mecanicos.forEach(m => {
        select.innerHTML += `<option value="${[se quitó el vínculo sospechoso]}">${m.nombre} - ${m.especialidad}</option>`;
      });
      new bootstrap.Modal(document.getElementById('modalAsignar')).show();
    }

    document.getElementById('formAsignar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const ordenId = document.getElementById('asigOrdenId').value;
      const mecanico_id = document.getElementById('asigMecanicoId').value;

      const res = await fetch(`/api/ordenes/${ordenId}/mecanico`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mecanico_id })
      });

      if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('modalAsignar')).hide();
        cargarOrdenes();
      } else {
        alert('Error al asignar mecánico');
      }
    });

    async function cambiarEstado(ordenId, nuevoEstado) {
      if (!nuevoEstado) return;
      const res = await fetch(`/api/ordenes/${ordenId}/estado`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nuevoEstado })
      });

      if (res.ok) {
        cargarOrdenes();
      } else {
        alert('Error al actualizar el estado');
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login.html';
    }

    cargarOrdenes();
  </script>
</body>
</html>
