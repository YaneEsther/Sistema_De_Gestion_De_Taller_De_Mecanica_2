<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TallerGest v2 - Usuarios y Roles</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary-color: #1E3A6D;
      --accent-color: #D18800;
      --bg-light: #E9EDF2;
    }
    body { background-color: var(--bg-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { background-color: var(--primary-color); min-height: 100vh; color: white; }
    .sidebar .nav-link { color: rgba(255, 255, 255, 0.8); margin-bottom: 4px; border-radius: 6px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: rgba(255, 255, 255, 0.15); color: white; }
    .btn-gold { background-color: var(--accent-color); color: white; font-weight: 600; }
    .btn-gold:hover { background-color: #b57500; color: white; }
    .card-header-custom { background-color: var(--primary-color); color: white; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Menú Lateral -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar p-3 collapse">
        <div class="d-flex align-items-center mb-4">
          <i class="bi bi-gear-wide-connected fs-2 text-warning me-2"></i>
          <span class="fs-4 fw-bold">TallerGest</span>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html"><i class="bi bi-people me-2"></i>Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="ordenes.html"><i class="bi bi-tools me-2"></i>Órdenes de trabajo</a></li>
          <li class="nav-item"><a class="nav-link active" href="usuarios.html"><i class="bi bi-person-badge me-2"></i>Usuarios y roles</a></li>
        </ul>
      </nav>

      <!-- Contenido Principal -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2><i class="bi bi-person-gear me-2"></i>Gestión de Usuarios y Roles</h2>
          <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#userModal">
            <i class="bi bi-plus-lg me-1"></i> Nuevo usuario
          </button>
        </div>

        <!-- Tabla de Usuarios -->
        <div class="card shadow-sm border-0">
          <div class="card-header card-header-custom">
            Usuarios Registrados
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Nombre Completo</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Fecha de Registro</th>
                  </tr>
                </thead>
                <tbody id="userTableBody">
                  <tr>
                    <td colspan="6" class="text-center py-3">Cargando usuarios...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal para Crear Usuario -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header card-header-custom">
          <h5 class="modal-title" id="userModalLabel"><i class="bi bi-person-plus me-2"></i>Crear Nuevo Usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="userForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="nombre" required placeholder="Ej. Carlos Pérez">
            </div>
            <div class="mb-3">
              <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
              <input type="text" class="form-control" id="nombreUsuario" required placeholder="Ej. cperez">
            </div>
            <div class="mb-3">
              <label for="clave" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="clave" required minlength="6">
            </div>
            <div class="mb-3">
              <label for="rol" class="form-label">Rol</label>
              <select class="form-select" id="rol" required>
                <option value="Administrador">Administrador</option>
                <option value="Mecánico">Mecánico</option>
                <option value="Recepcionista">Recepcionista</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="estado" class="form-label">Estado</label>
              <select class="form-select" id="estado">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-gold">Guardar Usuario</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JS Bootstrap & Script de Consumo de API -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadUsers);

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        const tbody = document.getElementById('userTableBody');
        
        if (data.ok && data.users.length > 0) {
          tbody.innerHTML = data.users.map(u => `
            <tr>
              <td><strong>#${u.id}</strong></td>
              <td>${u.nombre}</td>
              <td><code>${u.nombreUsuario}</code></td>
              <td><span class="badge bg-primary">${u.rol}</span></td>
              <td><span class="badge ${u.estado === 'Activo' ? 'bg-success' : 'bg-danger'}">${u.estado}</span></td>
              <td>${new Date(u.fechaCreacion).toLocaleDateString()}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No hay usuarios registrados.</td></tr>';
        }
      } catch (err) {
        console.error('Error al cargar usuarios:', err);
      }
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = {
        nombre: document.getElementById('nombre').value,
        nombreUsuario: document.getElementById('nombreUsuario').value,
        clave: document.getElementById('clave').value,
        rol: document.getElementById('rol').value,
        estado: document.getElementById('estado').value
      };

      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        });
        const data = await res.json();

        if (data.ok) {
          alert('¡Usuario creado exitosamente!');
          bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
          document.getElementById('userForm').reset();
          loadUsers();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Ocurrió un error al registrar el usuario.');
      }
    });
  </script>
</body>
</html>
